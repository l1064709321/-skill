# 天衍 配置文件示例
# 默认无内置密钥，首次使用须配置:
#   1) 交互式启动时选择「不跳过」输入密钥
#   2) 或启动后在前端「模型配置」界面填写
#   3) 或用 CLI 参数: tianyan --api-key sk-xxx
#   4) 或设置环境变量: TIANYAN_API_KEY=sk-xxx
# 无需手动编辑本文件。

data_dir: ~/.tianyan
server_host: 0.0.0.0
server_port: 8000

max_steps: 8
chunk_size: 2000
chunk_overlap: 200
retrieve_k: 6

# 默认模型 (agent 实际使用的模型, litellm 前缀格式)
# 留空则读环境变量 TIANYAN_API_KEY / AGNES_API_KEY
default_model:
  model: agnes/agnes-2.5-flash
  api_key: ""
  api_base: "https://apihub.agnes-ai.com/v1"
  temperature: 0.8
  max_tokens: 4096

# 预设模型列表 (前端「添加模型」可快捷选,也可自行增删)
models:
  - model: agnes/agnes-2.5-flash
    api_key: ""
    api_base: "https://apihub.agnes-ai.com/v1"
  - model: deepseek/deepseek-v4-pro
  - model: deepseek/deepseek-v4-flash
  - model: deepseek/deepseek-v4-flash-vision-exp
  - model: deepseek/deepseek-v3.1
  - model: deepseek/deepseek-r1
  - model: openai/gpt-5.6-terra
  - model: gemini/gemini-3.1-flash
  - model: dashscope/qwen3.6-plus
  - model: zai/glm-5.2
  - model: moonshot/kimi-k2.7-code
  - model: siliconflow/deepseek-ai/DeepSeek-V4-Flash
  - model: ollama/qwen3:14b
    api_base: http://localhost:11434
  # 小米 MiMo (OpenAI 兼容, env: XIAOMI_API_KEY)
  - model: openai/mimo-v2.5-pro
    api_base: https://api.xiaomimimo.com/v1
  # 华为盘古 MaaS (OpenAI 兼容, env: MAAS_API_KEY)
  - model: openai/openpangu-2.0-flash
    api_base: https://api.modelarts-maas.com/v2
  # 零一万物 01.AI
  - model: yi/yi-lightning
  - model: yi/yi-large
  # 百川智能 Baichuan
  - model: baichuan/baichuan4-turbo
  - model: baichuan/baichuan4-air
  # 阶跃星辰 StepFun
  - model: stepfun/step-2-16k
  - model: stepfun/step-2-32k
  # 腾讯混元 Hunyuan
  - model: hunyuan/hunyuan-turbos-latest
  - model: hunyuan/hunyuan-large
